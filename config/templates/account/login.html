<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ورود | شیپیلی شاپ
    </title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Tahoma, Arial, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            color: #111827;

            display: flex;
            flex-direction: column;
        }


        a {
            text-decoration: none;
        }


        /* =========================
           Header
        ========================= */

        header {
            background: rgba(255, 255, 255, 0.92);

            border-bottom:
                1px solid #e5e7eb;

            backdrop-filter:
                blur(10px);
        }


        .header-container {
            max-width: 1200px;

            width: 100%;

            margin: auto;

            padding:
                18px 25px;

            display: flex;

            align-items: center;

            justify-content:
                space-between;
        }


        .logo {
            font-size: 26px;

            font-weight: bold;

            color: #111827;
        }


        .logo span {
            color: #6366f1;
        }


        .back-link {
            color: #4f46e5;

            font-size: 14px;

            font-weight: bold;

            transition: 0.2s;
        }


        .back-link:hover {
            color: #312e81;
        }


        /* =========================
           Main
        ========================= */

        main {
            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                50px 20px;
        }


        .auth-wrapper {
            width: 100%;

            max-width: 460px;
        }


        .auth-card {
            background: #ffffff;

            border-radius: 24px;

            padding:
                42px 38px;

            box-shadow:
                0 20px 60px
                rgba(79, 70, 229, 0.12);

            border:
                1px solid #eef2ff;
        }


        /* =========================
           Auth Header
        ========================= */

        .auth-header {
            text-align: center;

            margin-bottom: 35px;
        }


        .auth-icon {
            width: 70px;

            height: 70px;

            margin:
                0 auto 18px;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;

            box-shadow:
                0 10px 25px
                rgba(79, 70, 229, 0.25);
        }


        .auth-header h1 {
            font-size: 27px;

            margin-bottom: 10px;

            color: #111827;
        }


        .auth-header p {
            font-size: 14px;

            color: #6b7280;

            line-height: 1.9;
        }


        /* =========================
           Messages
        ========================= */

        .messages {
            margin-bottom: 22px;
        }


        .message {
            background: #fef2f2;

            color: #b91c1c;

            border-right:
                4px solid #ef4444;

            padding:
                13px 15px;

            border-radius: 10px;

            margin-bottom: 10px;

            font-size: 14px;
        }


        /* =========================
           Form
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }


        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: bold;

            color: #374151;
        }


        input {
            width: 100%;

            border:
                1px solid #d1d5db;

            border-radius: 12px;

            padding:
                14px 15px;

            font-size: 15px;

            outline: none;

            transition:
                border 0.2s,
                box-shadow 0.2s;

            background: #f9fafb;
        }


        input:focus {
            border-color: #6366f1;

            background: white;

            box-shadow:
                0 0 0 4px
                rgba(99, 102, 241, 0.12);
        }


        .login-btn {
            width: 100%;

            border: none;

            cursor: pointer;

            margin-top: 8px;

            padding:
                15px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;

            font-family: inherit;

            font-size: 16px;

            font-weight: bold;

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }


        .login-btn:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 12px 25px
                rgba(79, 70, 229, 0.25);
        }


        /* =========================
           Footer Text
        ========================= */

        .auth-footer {
            text-align: center;

            margin-top: 28px;

            color: #6b7280;

            font-size: 14px;
        }


        .auth-footer a {
            color: #4f46e5;

            font-weight: bold;

            margin-right: 5px;
        }


        .auth-footer a:hover {
            color: #312e81;
        }


        /* =========================
           Footer
        ========================= */

        footer {
            text-align: center;

            padding:
                25px;

            color: #9ca3af;

            font-size: 13px;
        }


        /* =========================
           Responsive
        ========================= */

        @media (max-width: 500px) {

            .auth-card {
                padding:
                    32px 22px;
            }


            .header-container {
                padding:
                    15px 20px;
            }


            .logo {
                font-size: 22px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     Header
========================= -->

<header>

    <div class="header-container">

        <a
            href="{% url 'home' %}"
            class="logo"
        >
            شیپیلی
            <span>
                شاپ
            </span>
        </a>


        <a
            href="{% url 'home' %}"
            class="back-link"
        >
            بازگشت به فروشگاه
        </a>

    </div>

</header>


<!-- =========================
     Main
========================= -->

<main>

    <div class="auth-wrapper">


        <div class="auth-card">


            <!-- Auth Header -->

            <div class="auth-header">

                <div class="auth-icon">
                    👋
                </div>


                <h1>
                    خوش آمدید
                </h1>


                <p>
                    برای ادامه خرید وارد حساب کاربری خود شوید.
                </p>

            </div>


            <!-- Messages -->

            {% if messages %}

                <div class="messages">

                    {% for message in messages %}

                        <div class="message">

                            {{ message }}

                        </div>

                    {% endfor %}

                </div>

            {% endif %}


            <!-- Login Form -->

            <form method="post">

                {% csrf_token %}

                <input
                type="hidden"
                name="next"
                value="{{ next }}"
            >   



                <div class="form-group">

                    <label for="username">

                        نام کاربری

                    </label>


                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="نام کاربری خود را وارد کنید"
                        required
                        autofocus
                    >

                </div>


                <div class="form-group">

                    <label for="password">

                        رمز عبور

                    </label>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="رمز عبور خود را وارد کنید"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    ورود به حساب
                </button>


            </form>


            <!-- Register Link -->

            <div class="auth-footer">

                هنوز حساب کاربری ندارید؟

                <a
                    href="{% url 'register' %}"
                >
                    ثبت نام کنید
                </a>

            </div>


        </div>


    </div>

</main>


<!-- =========================
     Footer
========================= -->

<footer>

    © شیپیلی شاپ — تجربه یک خرید بهتر 🛍️

</footer>


</body>

</html>
