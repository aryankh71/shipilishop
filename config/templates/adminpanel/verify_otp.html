<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>تأیید OTP</title>
</head>

<body>

    <h1>تأیید رمز یکبارمصرف</h1>

    {% if error %}
        <p style="color:red;">
            {{ error }}
        </p>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <input
            type="text"
            name="otp"
            maxlength="6"
            inputmode="numeric"
            autocomplete="one-time-code"
            placeholder="کد ۶ رقمی"
            required
        >

        <button type="submit">
            تأیید OTP
        </button>

    </form>

</body>

</html>
